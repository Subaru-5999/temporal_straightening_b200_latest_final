[pytest]
# Repo-root pytest configuration for the CCR test suite.
#
# This file's presence pins the rootdir to the repo root, so `pytest` from the
# repo root collects only tests/ and property tests can resolve `conf/`,
# `models/` and `custom_resolvers.py` by relative path.
#
# Test-only dependencies live in requirements-dev.txt (pytest, hypothesis).
# They are deliberately absent from requirements-train.txt / requirements-plan.txt.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every property test runs at least 100 examples (design: "Minimum 100
# iterations per property"). Hypothesis profiles have to be registered in
# Python, so the `ccr` profile is registered in tests/conftest.py with
# max_examples >= 100 and no per-example deadline (a CPU torch forward pass
# blows through hypothesis' default 200ms deadline and would flake). This
# addopts line is what selects it, for every invocation, without anyone having
# to remember a flag.
addopts =
    --hypothesis-profile=ccr
    -ra
    --strict-markers

# Keep collection off runtime artifacts and vendored trees.
norecursedirs =
    .git
    .kiro
    .ipynb_checkpoints
    checkpoints
    outputs
    probe_outputs
    wandb
    env
    metrics/lpipsPyTorch
